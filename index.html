<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - CodeRunner</title>
    <style>
        body { font-family: monospace; background-color: #121212; color: white; display: flex; flex-direction: column; align-items: center; margin-top: 50px; }
        canvas { border: 2px solid #00FF00; background-color: #000; }
        h2 { color: #00FF00; }
    </style>
</head>
<body>
    <h2>Snake Game</h2>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p>Use Arrow Keys to move!</p>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const box = 20;
        let snake = [{x: 200, y: 200}, {x: 180, y: 200}, {x: 160, y: 200}];
        let direction = 'RIGHT';
        let food = {x: 100, y: 100};
        let score = 0;
        let game;

        document.addEventListener('keydown', (event) => {
            if(event.key === 'ArrowUp' && direction !== 'DOWN') direction = 'UP';
            if(event.key === 'ArrowDown' && direction !== 'UP') direction = 'DOWN';
            if(event.key === 'ArrowLeft' && direction !== 'RIGHT') direction = 'LEFT';
            if(event.key === 'ArrowRight' && direction !== 'LEFT') direction = 'RIGHT';
        });

        function draw() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, 400, 400);
            
            ctx.fillStyle = 'red';
            ctx.fillRect(food.x, food.y, box, box);
            
            ctx.fillStyle = 'lime';
            for(let i = 0; i < snake.length; i++) {
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }
        }

        function update() {
            let head = {x: snake[0].x, y: snake[0].y};
            if(direction === 'RIGHT') head.x += box;
            if(direction === 'LEFT') head.x -= box;
            if(direction === 'UP') head.y -= box;
            if(direction === 'DOWN') head.y += box;
            
            if(head.x === food.x && head.y === food.y) {
                score++;
                food = {x: Math.floor(Math.random() * 20) * 20, y: Math.floor(Math.random() * 20) * 20};
            } else {
                snake.pop();
            }
            
            if(head.x >= 400 || head.x < 0 || head.y >= 400 || head.y < 0 || snake.some(s => s.x === head.x && s.y === head.y)) {
                clearInterval(game);
                alert("Game Over! Score: " + score);
                return;
            }
            
            snake.unshift(head);
            draw();
        }

        function startGame() {
            game = setInterval(update, 100);
        }

        startGame();
    </script>
</body>
</html>
