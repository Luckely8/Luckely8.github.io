<!DOCTYPE html><html>
<head>
    <title>CodeRunner Agent</title>
    <style>
        body { font-family: monospace; background-color: #121212; color: white; padding: 20px; }
        textarea { width: 100%; height: 250px; background: #1E1E1E; color: #00FF00; border: none; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; background: green; color: white; border: none; cursor: pointer; margin: 5px; }
        #output { background: #1E1E1E; padding: 10px; margin-top: 10px; min-height: 100px; color: cyan; }
    </style>
</head>
<body>
    <h2>⚡ CodeRunner Agent</h2>
    <textarea id="code" placeholder="Type your prompt here... (e.g., Build me a To-Do List App)">Build me a To-Do List App</textarea>
    <br>
    <button onclick="buildApp()">Build App</button>
    <button onclick="downloadFile()">Download File</button>
    <div id="output">Generated App Code will appear here...</div>

    <script>
        function buildApp() {
            const prompt = document.getElementById('code').value;
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = "Generating your app...";

            // 1. Ask for the API key
            const apiKey = prompt("Enter your Gemini API Key:");
            if (!apiKey) return;

            // 2. Send to Gemini
            fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Write a complete single-file HTML, CSS, and JavaScript app for this request: ${prompt}. Return ONLY the code.` }] }]
                })
            })
            .then(response => response.json())
            .then(data => {
                const text = data.candidates[0].content.parts[0].text;
                const cleanCode = text.replace(/```html/g, "").replace(/```/g, "").trim();
                outputDiv.innerHTML = cleanCode;
            })
            .catch(error => {
                outputDiv.innerHTML = "Error: " + error;
            });
        }

        function downloadFile() {
            const code = document.getElementById('output').innerText;
            const blob = new Blob([code], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "myapp.html";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
