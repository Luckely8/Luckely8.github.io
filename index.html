<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeRunner Web - Professional IDE</title>
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <style>
        body { font-family: monospace; background-color: #121212; color: white; padding: 20px; }
        .container { display: flex; gap: 20px; }
        .sidebar { width: 250px; background: #1E1E1E; padding: 15px; border-radius: 5px; }
        .main-area { flex: 1; }
        .btn-row { display: flex; gap: 8px; margin-top: 10px; }
        .CodeMirror { height: 300px; border-radius: 5px; }
        button { padding: 10px 20px; background: green; color: white; border: none; cursor: pointer; border-radius: 5px; font-family: monospace; }
        button:hover { background: darkgreen; }
        #output { background: #1E1E1E; padding: 10px; margin-top: 10px; min-height: 100px; color: lime; border-radius: 5px; }
        #aiOutput { background: #1E1E1E; padding: 10px; margin-top: 10px; min-height: 100px; color: cyan; border-radius: 5px; }
        .sidebar h3 { color: #4CAF50; }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar li { padding: 5px 0; cursor: pointer; }
        .sidebar li:hover { color: #4CAF50; }
        .sidebar input { width: 90%; padding: 5px; background: #121212; color: white; border: 1px solid #4CAF50; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>⚡ CodeRunner Web</h2>
    
    <div class="container">
        <div class="sidebar">
            <h3>📂 Projects</h3>
            <input type="text" id="fileName" placeholder="Enter filename...">
            <button onclick="createFile()">New File</button>
            <ul id="fileList"></ul>
        </div>
        
        <div class="main-area">
            <!-- This hidden textarea will be replaced by CodeMirror -->
            <textarea id="code"></textarea>
            
            <div class="btn-row">
                <button onclick="runCode(71)">Run Python</button>
                <button onclick="runCode(63)">Run JavaScript</button>
                <button onclick="runCode(54)">Run C++</button>
                <button onclick="runCode(62)">Run Java</button>
                <button onclick="saveCode()">Save Current File</button>
                <button onclick="askAI()">AI Help</button>
                <button onclick="shareCode()">Share Code</button>
            </div>
            
            <div id="output">Output will appear here...</div>
            <div id="aiOutput">AI Help will appear here...</div>
        </div>
    </div>

    <!-- CodeMirror Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <!-- Python Mode -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <!-- JavaScript Mode -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <!-- C++ Mode -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>
    <!-- Java Mode -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>

    <script>
        let currentFile = "main.py";

        // Initialize CodeMirror with Syntax Highlighting
        const editor = CodeMirror.fromTextArea(document.getElementById('code'), {
            lineNumbers: true,
            mode: 'python', // Default to Python
            theme: 'dracula',
            indentUnit: 4,
            tabSize: 4
        });

        function createFile() {
            const fileName = document.getElementById('fileName').value;
            if (fileName) {
                const fileList = document.getElementById('fileList');
                const li = document.createElement('li');
                li.textContent = fileName;
                li.onclick = () => loadFile(fileName);
                fileList.appendChild(li);
                document.getElementById('fileName').value = "";
            }
        }

        function saveCode() {
            const code = editor.getValue();
            localStorage.setItem('currentCode', code);
            document.getElementById('output').innerHTML = "Code Saved!";
        }

        function loadFile(fileName) {
            editor.setValue(localStorage.getItem('currentCode') || "");
            document.getElementById('output').innerHTML = "Loaded " + fileName;
            currentFile = fileName;
        }

        function shareCode() {
            const code = editor.getValue();
            const encodedCode = btoa(code);
            const shareUrl = window.location.origin + window.location.pathname + "#code=" + encodedCode;
            const copyText = "Check out this code: " + shareUrl;
            
            navigator.clipboard.writeText(copyText).then(() => {
                document.getElementById('output').innerHTML = "Code link copied to clipboard!";
            }).catch(err => {
                document.getElementById('output').innerHTML = "Error copying: " + err;
            });
        }

        function changeLanguage(language) {
            editor.setOption('mode', language);
        }

        function runCode(languageId, languageName) {
            const code = editor.getValue();
            changeLanguage(languageName);
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = "Running...";

            fetch('https://ce.judge0.com/submissions/?base64_encoded=false&wait=true', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    source_code: code,
                    language_id: languageId
                })
            })
            .then(response => response.json())
            .then(data => {
                let result = data.stdout || data.stderr || data.compile_output || "No output";
                outputDiv.innerHTML = result;
            })
            .catch(error => {
                outputDiv.innerHTML = "Error: " + error;
            });
        }

        function askAI() {
            const code = editor.getValue();
            const aiOutputDiv = document.getElementById('aiOutput');
            aiOutputDiv.innerHTML = "AI is thinking...";

            const provider = prompt(
                "Choose AI Provider:\n" +
                "1. DeepSeek\n" +
                "2. Groq\n" +
                "3. Mistral\n" +
                "4. OpenAI (ChatGPT)\n" +
                "5. Gemini\n" +
                "6. Custom"
            );

            let baseUrl = "";
            let model = "";
            let apiKey = "";
            let isGemini = false;

            if (provider === "1") {
                baseUrl = "https://api.deepseek.com/v1";
                model = "deepseek-v4-pro";
            } else if (provider === "2") {
                baseUrl = "https://api.groq.com/openai/v1";
                model = "openai/gpt-oss-120b";
            } else if (provider === "3") {
                baseUrl = "https://api.mistral.ai/v1";
                model = "mistral-medium-3.5";
            } else if (provider === "4") {
                baseUrl = "https://api.openai.com/v1";
                model = "gpt-4o-mini";
            } else if (provider === "5") {
                isGemini = true;
                model = "gemini-3.5-flash";
            } else if (provider === "6") {
                baseUrl = prompt("Enter the custom API Base URL (e.g., https://api.example.com/v1):");
                model = prompt("Enter the model name:");
            } else {
                aiOutputDiv.innerHTML = "Invalid provider selected.";
                return;
            }

            apiKey = prompt("Enter your " + (provider === "5" ? "Gemini" : "API") + " Key:");

            if (isGemini) {
                fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Explain this code: ${code}` }] }]
                    })
                })
                .then(response => response.json())
                .then(data => {
                    aiOutputDiv.innerHTML = data.candidates[0].content.parts[0].text;
                })
                .catch(error => {
                    aiOutputDiv.innerHTML = "Error: " + error;
                });
            } else {
                fetch(`${baseUrl}/chat/completions`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: "user", content: `Explain this code: ${code}` }]
                    })
                })
                .then(response => response.json())
                .then(data => {
                    aiOutputDiv.innerHTML = data.choices[0].message.content;
                })
                .catch(error => {
                    aiOutputDiv.innerHTML = "Error: " + error;
                });
            }
        }
    </script>
</body>
</html>
