<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap to Jump!</title>
    <style>
        body { font-family: monospace; background-color: #121212; color: white; display: flex; flex-direction: column; align-items: center; margin-top: 50px; }
        canvas { border: 2px solid #00FF00; background-color: #000; touch-action: manipulation; }
        h2 { color: #00FF00; }
        button { padding: 10px; margin: 5px; background: #00FF00; color: #000; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Tap to Jump!</h2>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <button onclick="startGame()">Start Game</button>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let player = { y: 300, vy: 0, gravity: 0.5, jump: -10 };
        let obstacles = [];
        let score = 0;
        let gameRunning = false;
        let game;
        
        canvas.addEventListener('touchstart', () => {
            if (gameRunning) player.vy = player.jump;
        });
        canvas.addEventListener('mousedown', () => {
            if (gameRunning) player.vy = player.jump;
        });
        
        function draw() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, 400, 400);
            
            ctx.fillStyle = 'lime';
            ctx.fillRect(50, player.y, 30, 30);
            
            ctx.fillStyle = 'red';
            for(let i = 0; i < obstacles.length; i++) {
                ctx.fillRect(obstacles[i].x, obstacles[i].y, 20, 50);
            }
            
            ctx.fillStyle = 'white';
            ctx.font = '20px monospace';
            ctx.fillText('Score: ' + score, 20, 30);
        }
        
        function update() {
            player.vy += player.gravity;
            player.y += player.vy;
            
            if(player.y > 370) {
                player.y = 370;
                player.vy = 0;
            }
            
            if(player.y < 0) {
                player.y = 0;
                player.vy = 0;
            }
            
            obstacles.forEach((obstacle, index) => {
                obstacle.x -= 5;
                if(obstacle.x < -20) {
                    obstacles.splice(index, 1);
                    score++;
                }
                if(obstacle.x < 80 && obstacle.x > 40 && player.y > 330) {
                    clearInterval(game);
                    gameRunning = false;
                    alert("Game Over! Score: " + score);
                }
            });
            
            if(Math.random() < 0.02) {
                obstacles.push({ x: 400, y: 320 });
            }
        }
        
        function startGame() {
            score = 0;
            player.y = 300;
            player.vy = 0;
            obstacles = [];
            if(game) clearInterval(game);
            game = setInterval(() => {
                update();
                draw();
            }, 50);
            gameRunning = true;
        }
        
        draw();
    </script>
</body>
</html>
