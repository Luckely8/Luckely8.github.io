<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeRunner Web - The Cloud IDE</title>
    <style>
        body {
            font-family: monospace;
            background-color: #121212;
            color: white;
            padding: 20px;
        }
        textarea {
            width: 100%;
            height: 300px;
            background: #1E1E1E;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            resize: vertical;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
            margin-right: 5px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: darkgreen;
        }
        #output {
            background: #1E1E1E;
            padding: 10px;
            margin-top: 10px;
            min-height: 100px;
            color: lime;
            border-radius: 5px;
        }
        #aiOutput {
            background: #1E1E1E;
            padding: 10px;
            margin-top: 10px;
            min-height: 100px;
            color: cyan;
            border-radius: 5px;
        }
        .btn-row {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h2>⚡ CodeRunner Web</h2>
    
    <textarea id="code" placeholder="Type code here...">print("Hello World")</textarea>
    
    <div class="btn-row">
        <button onclick="runPython()">Run Python</button>
        <button onclick="runJavaScript()">Run JavaScript</button>
        <button onclick="saveCode()">Save Code</button>
        <button onclick="loadCode()">Load Code</button>
        <button onclick="askAI()">AI Help</button>
    </div>

    <div id="output">Output will appear here...</div>
    <div id="aiOutput">AI Help will appear here...</div>

    <script>
        // Save code to browser's local storage
        function saveCode() {
            const code = document.getElementById('code').value;
            localStorage.setItem('savedCode', code);
            document.getElementById('output').innerHTML = "Code Saved!";
        }

        // Load code from browser's local storage
        function loadCode() {
            const saved = localStorage.getItem('savedCode');
            if (saved) {
                document.getElementById('code').value = saved;
                document.getElementById('output').innerHTML = "Code Loaded!";
            } else {
                document.getElementById('output').innerHTML = "No saved code found!";
            }
        }

        function runPython() {
            const code = document.getElementById('code').value;
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = "Running...";

            // Send code to Judge0 API (Cloud Execution - Python 3)
            fetch('https://ce.judge0.com/submissions/?base64_encoded=false&wait=true', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    source_code: code,
                    language_id: 71 // Python 3
                })
            })
            .then(response => response.json())
            .then(data => {
                let result = data.stdout || data.stderr || data.compile_output || "No output";
                outputDiv.innerHTML = result;
            })
            .catch(error => {
                outputDiv.innerHTML = "Error: " + error;
            });
        }

        function runJavaScript() {
            const code = document.getElementById('code').value;
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = "Running...";

            // Send code to Judge0 API (Cloud Execution - JavaScript/Node.js)
            fetch('https://ce.judge0.com/submissions/?base64_encoded=false&wait=true', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    source_code: code,
                    language_id: 63 // JavaScript (Node.js)
                })
            })
            .then(response => response.json())
            .then(data => {
                let result = data.stdout || data.stderr || data.compile_output || "No output";
                outputDiv.innerHTML = result;
            })
            .catch(error => {
                outputDiv.innerHTML = "Error: " + error;
            });
        }

        // Universal AI Support (Gemini, OpenAI, DeepSeek, Groq, Mistral, Custom)
        function askAI() {
            const code = document.getElementById('code').value;
            const aiOutputDiv = document.getElementById('aiOutput');
            aiOutputDiv.innerHTML = "AI is thinking...";

            // Step 1: Ask which provider to use
            const provider = prompt(
                "Choose AI Provider:\n" +
                "1. DeepSeek\n" +
                "2. Groq\n" +
                "3. Mistral\n" +
                "4. OpenAI (ChatGPT)\n" +
                "5. Gemini\n" +
                "6. Custom"
            );

            let baseUrl = "";
            let model = "";
            let apiKey = "";
            let isGemini = false;

            // Step 2: Set up the URL and Model for each provider
            if (provider === "1") { // DeepSeek
                baseUrl = "https://api.deepseek.com/v1";
                model = "deepseek-v4-pro";
            } else if (provider === "2") { // Groq
                baseUrl = "https://api.groq.com/openai/v1";
                model = "openai/gpt-oss-120b";
            } else if (provider === "3") { // Mistral
                baseUrl = "https://api.mistral.ai/v1";
                model = "mistral-medium-3.5";
            } else if (provider === "4") { // OpenAI (ChatGPT)
                baseUrl = "https://api.openai.com/v1";
                model = "gpt-4o-mini";
            } else if (provider === "5") { // Gemini
                isGemini = true;
                model = "gemini-3.5-flash";
            } else if (provider === "6") { // Custom
                baseUrl = prompt("Enter the custom API Base URL (e.g., https://api.example.com/v1):");
                model = prompt("Enter the model name:");
            } else {
                aiOutputDiv.innerHTML = "Invalid provider selected.";
                return;
            }

            // Step 3: Ask for the API Key (Secure, never stored)
            apiKey = prompt("Enter your " + (provider === "5" ? "Gemini" : "API") + " Key:");

            // Step 4: Send the request
            if (isGemini) {
                // Gemini uses a different URL and format
                fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Explain this code: ${code}` }] }]
                    })
                })
                .then(response => response.json())
                .then(data => {
                    aiOutputDiv.innerHTML = data.candidates[0].content.parts[0].text;
                })
                .catch(error => {
                    aiOutputDiv.innerHTML = "Error: " + error;
                });
            } else {
                // All other providers use the OpenAI-compatible format
                fetch(`${baseUrl}/chat/completions`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: "user", content: `Explain this code: ${code}` }]
                    })
                })
                .then(response => response.json())
                .then(data => {
                    aiOutputDiv.innerHTML = data.choices[0].message.content;
                })
                .catch(error => {
                    aiOutputDiv.innerHTML = "Error: " + error;
                });
            }
        }
    </script>
</body>
</html>
