<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeRunner Web - The Cloud IDE</title>
    <style>
        body { font-family: monospace; background-color: #121212; color: white; padding: 20px; }
        textarea { width: 100%; height: 300px; background: #1E1E1E; color: white; border: none; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; margin-top: 10px; background: green; color: white; border: none; cursor: pointer; }
        button:hover { background: darkgreen; }
        #output { background: #1E1E1E; padding: 10px; margin-top: 10px; min-height: 100px; color: lime; }
    </style>
</head>
<body>
    <h2>⚡ CodeRunner Web</h2>
    <textarea id="code" placeholder="Type Python code here..." oninput="updateOutput()">print("Hello World")</textarea>
    <br>
    <button onclick="runCode()">Run Code</button>
    <div id="output">Output will appear here...</div>

    <script>
        function updateOutput() {
            // This is just a placeholder for now.
        }

        function runCode() {
            const code = document.getElementById('code').value;
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = "Running...";

            // Send code to Judge0 API (Cloud Execution)
            fetch('https://ce.judge0.com/submissions/?base64_encoded=false&wait=true', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    source_code: code,
                    language_id: 71 // Python 3
                })
            })
            .then(response => response.json())
            .then(data => {
                let result = data.stdout || data.stderr || data.compile_output || "No output";
                outputDiv.innerHTML = result;
            })
            .catch(error => {
                outputDiv.innerHTML = "Error: " + error;
            });
        }
    </script>
</body>
</html>
