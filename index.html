<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Mouse Control</title>
    <style>
        body { font-family: monospace; background-color: #121212; color: white; display: flex; flex-direction: column; align-items: center; margin-top: 50px; }
        canvas { border: 2px solid #00FF00; background-color: #000; cursor: pointer; }
        h2 { color: #00FF00; }
        #controls { margin-top: 20px; }
        button { padding: 10px; margin: 5px; background: #00FF00; color: #000; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Snake Game (Mouse Only)</h2>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="controls">
        <button onclick="changeDirection('UP')">⬆️ Up</button>
        <button onclick="changeDirection('DOWN')">⬇️ Down</button>
        <button onclick="changeDirection('LEFT')">⬅️ Left</button>
        <button onclick="changeDirection('RIGHT')">➡️ Right</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const box = 20;
        let snake = [{x: 200, y: 200}, {x: 180, y: 200}, {x: 160, y: 200}];
        let direction = 'RIGHT';
        let food = {x: 100, y: 100};
        let score = 0;
        let game;

        function changeDirection(newDirection) {
            if (direction === 'UP' && newDirection === 'DOWN') return;
            if (direction === 'DOWN' && newDirection === 'UP') return;
            if (direction === 'LEFT' && newDirection === 'RIGHT') return;
            if (direction === 'RIGHT' && newDirection === 'LEFT') return;
            direction = newDirection;
        }

        function draw() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, 400, 400);
            
            ctx.fillStyle = 'red';
            ctx.fillRect(food.x, food.y, box, box);
            
            ctx.fillStyle = 'lime';
            for(let i = 0; i < snake.length; i++) {
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }
        }

        function update() {
            let head = {x: snake[0].x, y: snake[0].y};
            if(direction === 'RIGHT') head.x += box;
            if(direction === 'LEFT') head.x -= box;
            if(direction === 'UP') head.y -= box;
            if(direction === 'DOWN') head.y += box;
            
            if(head.x === food.x && head.y === food.y) {
                score++;
                food = {x: Math.floor(Math.random() * 20) * 20, y: Math.floor(Math.random() * 20) * 20};
            } else {
                snake.pop();
            }
            
            if(head.x >= 400 || head.x < 0 || head.y >= 400 || head.y < 0 || snake.some(s => s.x === head.x && s.y === head.y)) {
                clearInterval(game);
                alert("Game Over! Score: " + score);
                return;
            }
            
            snake.unshift(head);
            draw();
        }

        function startGame() {
            game = setInterval(update, 100);
        }

        startGame();
    </script>
</body>
</html>
