<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeRunner Agent</title>
    <style>
        body { font-family: monospace; background-color: #121212; color: white; padding: 20px; }
        textarea { width: 100%; height: 200px; background: #1E1E1E; color: #00FF00; border: none; padding: 10px; font-size: 16px; }
        input { width: 100%; padding: 10px; background: #1E1E1E; color: white; border: 1px solid #4CAF50; margin: 10px 0; }
        button { padding: 10px 20px; background: green; color: white; border: none; cursor: pointer; margin: 5px; }
        #output { background: #1E1E1E; padding: 10px; margin-top: 10px; min-height: 100px; color: cyan; }
    </style>
</head>
<body>
    <h2>⚡ CodeRunner Agent</h2>

    <!-- API Key Input -->
    <label>Enter your Gemini API Key:</label>
    <input type="text" id="apiKey" placeholder="Paste your key here...">

    <!-- Prompt Input -->
    <textarea id="code" placeholder="Type your prompt here...">Build me a To-Do List App</textarea>
    
    <br>
    <button onclick="buildApp()">Build App</button>
    <button onclick="downloadFile()">Download File</button>
    <div id="output">Generated App Code will appear here...</div>

    <script>
        function buildApp() {
            const promptText = document.getElementById('code').value;
            const apiKey = document.getElementById('apiKey').value;
            const outputDiv = document.getElementById('output');
            
            if (!apiKey) {
                outputDiv.innerHTML = "Please enter your API Key first!";
                return;
            }

            outputDiv.innerHTML = "Generating your app...";

            // Send to Gemini
           fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Write a complete single-file HTML, CSS, and JavaScript app for this request: ${promptText}. Return ONLY the code.` }] }]
                })
            })
            .then(response => response.json())
            .then(data => {
                // SAFE TEXT EXTRACTION FIX
                let text = "No response text found.";
                if (data.candidates && data.candidates[0]) {
                  if (data.candidates[0].content && data.candidates[0].content.parts) {
                    text = data.candidates[0].content.parts.map(p => p.text).join('');
                  } else if (data.candidates[0].output) { // New format for some models
                    text = data.candidates[0].output;
                  }
                }

                const cleanCode = text.replace(/```html/g, "").replace(/```/g, "").trim();
                outputDiv.innerHTML = cleanCode;
            })
            .catch(error => {
                outputDiv.innerHTML = "Error: " + error;
            });
        }

        function downloadFile() {
            const code = document.getElementById('output').innerText;
            const blob = new Blob([code], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "myapp.html";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
