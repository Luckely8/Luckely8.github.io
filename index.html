<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeRunner Agent</title>
</head>
<body style="font-family: monospace; background-color: #121212; color: white; padding: 20px;">
    <h2>⚡ CodeRunner Agent</h2>
    <label>Enter your Gemini API Key:</label>
    <input type="text" id="apiKey" placeholder="Paste your key here..." style="width: 100%; padding: 10px; margin: 10px 0;">
    <textarea id="code" placeholder="Type your prompt here..." style="width: 100%; height: 200px; background: #1E1E1E; color: #00FF00; border: none; padding: 10px;">Build a complete game. Write everything in one single HTML file. Include all CSS in style tags and ALL JavaScript in script tags. The game must be fully functional and start immediately. Do NOT give instructions. Do NOT write markdown. Only output the full HTML code.</textarea>
    <button onclick="buildApp()" style="padding: 10px 20px; background: green; color: white; border: none; cursor: pointer;">Build App</button>
    <div id="output" style="margin-top: 10px; display: none;"></div> <!-- HIDDEN -->
    <script>
        function buildApp() {
            const apiKey = document.getElementById('apiKey').value;
            const promptText = document.getElementById('code').value;
            document.getElementById('output').innerHTML = "Generating game...";
            fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + apiKey, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }]
                })
            })
            .then(r => r.json())
            .then(data => {
                let text = data.candidates[0].content.parts[0].text;
                // Create a NEW tab with the game code
                let newWindow = window.open();
                newWindow.document.write(text);
            })
            .catch(error => {
                alert("Error: " + error);
            });
        }
    </script>
</body>
</html>
