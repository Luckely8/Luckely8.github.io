<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeRunner Web - Pro IDE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <style>
        body {
            font-family: monospace;
            background-color: #121212;
            color: white;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .code-area {
            width: 100%;
            height: 300px;
            background: #1E1E1E;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            resize: vertical;
        }
        .code-area:focus {
            outline: none;
            border: 1px solid #4CAF50;
        }
        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-family: monospace;
        }
        button:hover {
            background: #45a049;
        }
        #output {
            background: #1E1E1E;
            padding: 10px;
            margin-top: 10px;
            min-height: 100px;
            color: lime;
            border-radius: 5px;
            font-family: monospace;
        }
        #aiOutput {
            background: #1E1E1E;
            padding: 10px;
            margin-top: 10px;
            min-height: 100px;
            color: cyan;
            border-radius: 5px;
            font-family: monospace;
        }
        .btn-row button {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>⚡ CodeRunner Web Pro</h2>
    </div>

    <textarea id="code" class="code-area" spellcheck="false" oninput="highlightCode()">print("Hello World")</textarea>

    <div class="btn-row">
        <button onclick="runCode(71)">Run Python</button>
        <button onclick="runCode(63)">Run JavaScript</button>
        <button onclick="runCode(54)">Run C++</button>
        <button onclick="saveCode()">Save Code</button>
        <button onclick="loadCode()">Load Code</button>
        <button onclick="askAI()">AI Help</button>
    </div>

    <div id="output">Output will appear here...</div>
    <div id="aiOutput">AI Help will appear here...</div>

    <!-- Syntax Highlighting Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <script>
        function highlightCode() {
            // Basic syntax highlighting for viewing (real highlighting will require more work)
            // We'll just ensure the textarea scrolls properly
        }

        function saveCode() {
            const code = document.getElementById('code').value;
            localStorage.setItem('savedCode', code);
            document.getElementById('output').innerHTML = "Code Saved!";
        }

        function loadCode() {
            const saved = localStorage.getItem('savedCode');
            if (saved) {
                document.getElementById('code').value = saved;
                document.getElementById('output').innerHTML = "Code Loaded!";
            } else {
                document.getElementById('output').innerHTML = "No saved code found!";
            }
        }

        function runCode(languageId) {
            const code = document.getElementById('code').value;
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = "Running...";

            // Send code to Judge0 API (Cloud Execution)
            fetch('https://ce.judge0.com/submissions/?base64_encoded=false&wait=true', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    source_code: code,
                    language_id: languageId
                })
            })
            .then(response => response.json())
            .then(data => {
                let result = data.stdout || data.stderr || data.compile_output || "No output";
                outputDiv.innerHTML = result;
            })
            .catch(error => {
                outputDiv.innerHTML = "Error: " + error;
            });
        }

        function askAI() {
            const code = document.getElementById('code').value;
            const aiOutputDiv = document.getElementById('aiOutput');
            aiOutputDiv.innerHTML = "AI is thinking...";

            // Ask which provider to use
            const provider = prompt(
                "Choose AI Provider:\n" +
                "1. DeepSeek\n" +
                "2. Groq\n" +
                "3. Mistral\n" +
                "4. OpenAI (ChatGPT)\n" +
                "5. Gemini\n" +
                "6. Custom"
            );

            let baseUrl = "";
            let model = "";
            let apiKey = "";
            let isGemini = false;

            if (provider === "1") {
                baseUrl = "https://api.deepseek.com/v1";
                model = "deepseek-v4-pro";
            } else if (provider === "2") {
                baseUrl = "https://api.groq.com/openai/v1";
                model = "openai/gpt-oss-120b";
            } else if (provider === "3") {
                baseUrl = "https://api.mistral.ai/v1";
                model = "mistral-medium-3.5";
            } else if (provider === "4") {
                baseUrl = "https://api.openai.com/v1";
                model = "gpt-4o-mini";
            } else if (provider === "5") {
                isGemini = true;
                model = "gemini-3.5-flash";
            } else if (provider === "6") {
                baseUrl = prompt("Enter the custom API Base URL (e.g., https://api.example.com/v1):");
                model = prompt("Enter the model name:");
            } else {
                aiOutputDiv.innerHTML = "Invalid provider selected.";
                return;
            }

            apiKey = prompt("Enter your " + (provider === "5" ? "Gemini" : "API") + " Key:");

            if (isGemini) {
                fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Explain this code: ${code}` }] }]
                    })
                })
                .then(response => response.json())
                .then(data => {
                    aiOutputDiv.innerHTML = data.candidates[0].content.parts[0].text;
                })
                .catch(error => {
                    aiOutputDiv.innerHTML = "Error: " + error;
                });
            } else {
                fetch(`${baseUrl}/chat/completions`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: "user", content: `Explain this code: ${code}` }]
                    })
                })
                .then(response => response.json())
                .then(data => {
                    aiOutputDiv.innerHTML = data.choices[0].message.content;
                })
                .catch(error => {
                    aiOutputDiv.innerHTML = "Error: " + error;
                });
            }
        }
    </script>
</body>
</html>
